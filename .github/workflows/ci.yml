name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Rebuild & verify open assets catalog
        run: node scripts/build-open-assets.mjs

      - name: Run smoke suite
        run: node tests/smoke.mjs

      - name: Run full verification & privacy audit
        run: node tests/verify-all.mjs

      - name: Check Codex installer integrity
        run: node scripts/install.mjs --check
